services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MOCK_INTEGRATION_URL: http://mock-integration:8001
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:3000}
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fake}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://127.0.0.1:11434}
      FORWARD_MAX_ATTEMPTS: ${FORWARD_MAX_ATTEMPTS:-3}
      FORWARD_TIMEOUT_SECONDS: ${FORWARD_TIMEOUT_SECONDS:-3}
      SOTEOPS_SEED_FILE: /app/seed/identities.json
      SOTEOPS_INSTRUCTIONS_FILE: /app/seed/instructions.json
      DEMO_AUTH_ENABLED: ${DEMO_AUTH_ENABLED:-true}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-local-session-secret}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      POLICY_FILE: /app/seed/policy/v1.json
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mock-integration:
        condition: service_started

  mock-integration:
    build:
      context: .
      dockerfile: mock-integration/Dockerfile
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:8001:8001"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
