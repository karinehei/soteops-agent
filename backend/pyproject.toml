[project]
name = "soteops-backend"
version = "0.1.0"
description = "SoteOps Agent FastAPI modular monolith."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16.5,<2",
  "fastapi[standard-no-fastapi-cloud-cli]>=0.141.1,<0.142",
  "psycopg[binary]>=3.2.9,<4",
  "pydantic-settings>=2.10.1,<3",
  "sqlalchemy>=2.0.43,<3",
]

[project.scripts]
soteops-seed = "app.seed:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
