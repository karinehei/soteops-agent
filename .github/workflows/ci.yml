name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  LLM_PROVIDER: fake
  ENVIRONMENT: ci
  LOG_LEVEL: INFO
  MOCK_INTEGRATION_URL: http://127.0.0.1:8001
  CORS_ORIGINS: http://127.0.0.1:3000
  DEMO_AUTH_ENABLED: "true"
  SESSION_SECRET: ci-session-secret-not-production
  COOKIE_SECURE: "false"
  POLICY_FILE: seed/policy/v1.json
  EMBEDDING_PROVIDER: fake
  LLM_MAX_RETRIES: "2"
  RETRIEVAL_TOP_K: "4"
  FORWARD_MAX_ATTEMPTS: "3"
  FORWARD_TIMEOUT_SECONDS: "3"

jobs:
  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --locked --all-packages --group dev

      - name: Python dependency audit
        run: |
          # Residual findings require major upgrades blocked by AGENTS.md /
          # pyproject pins (langgraph<1, pytest<9). Tracked in docs/security-review.md.
          uv run pip-audit \
            --ignore-vuln PYSEC-2026-83 \
            --ignore-vuln PYSEC-2026-2573 \
            --ignore-vuln PYSEC-2026-2574 \
            --ignore-vuln PYSEC-2026-2194 \
            --ignore-vuln PYSEC-2026-2575 \
            --ignore-vuln PYSEC-2026-1845

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: npm audit (high and critical)
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    env:
      DATABASE_URL: postgresql+psycopg://soteops:soteops@127.0.0.1:5432/soteops
      POSTGRES_USER: soteops
      POSTGRES_PASSWORD: soteops
      POSTGRES_DB: soteops
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17
        env:
          POSTGRES_USER: soteops
          POSTGRES_PASSWORD: soteops
          POSTGRES_DB: soteops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U soteops -d soteops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Verify lockfile
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --locked --all-packages --group dev

      - name: Format
        run: uv run ruff format --check backend mock-integration

      - name: Lint
        run: uv run ruff check backend mock-integration

      - name: Type check
        run: uv run mypy backend/app mock-integration/mock_integration

      - name: Apply migrations
        working-directory: backend
        run: uv run alembic upgrade head

      - name: Check migrations are current
        working-directory: backend
        run: uv run alembic check

      - name: Start mock integration
        run: |
          uv run uvicorn mock_integration.main:create_app --factory --app-dir mock-integration --host 127.0.0.1 --port 8001 &
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8001/health >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          echo "mock integration did not become healthy"
          exit 1

      - name: Test
        run: >
          uv run pytest
          --junitxml=junit.xml
          --cov
          --cov-report=term-missing
          --cov-report=xml

      - name: Upload test artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-test-results
          path: |
            junit.xml
            coverage.xml
            docs/results/evaluation-held-out-fake.json
            docs/results/evaluation-held-out-fake.md
          if-no-files-found: ignore

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Reject remote font fetches
        working-directory: .
        run: |
          if grep -R -n -E 'next/font/google|fonts\.googleapis\.com|fonts\.gstatic\.com' frontend/src frontend/next.config.ts frontend/package.json; then
            echo "Remote font references are not allowed."
            exit 1
          fi

      - name: Production build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
        run: npm run build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      DATABASE_URL: postgresql+psycopg://soteops:soteops@127.0.0.1:5432/soteops
      MOCK_INTEGRATION_URL: http://127.0.0.1:8001
      CORS_ORIGINS: http://127.0.0.1:3000
      DEMO_AUTH_ENABLED: "true"
      SESSION_SECRET: ci-session-secret-not-production
      COOKIE_SECURE: "false"
      POLICY_FILE: seed/policy/v1.json
      SOTEOPS_SEED_FILE: seed/identities.json
      SOTEOPS_INSTRUCTIONS_FILE: seed/instructions.json
      LLM_PROVIDER: fake
      EMBEDDING_PROVIDER: fake
      ENVIRONMENT: ci
      FORWARD_MAX_ATTEMPTS: "3"
      FORWARD_TIMEOUT_SECONDS: "3"
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
      PLAYWRIGHT_SKIP_WEBSERVER: "1"
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17
        env:
          POSTGRES_USER: soteops
          POSTGRES_PASSWORD: soteops
          POSTGRES_DB: soteops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U soteops -d soteops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install backend
        working-directory: .
        run: uv sync --locked --all-packages --group dev

      - name: Migrate and seed
        working-directory: backend
        run: |
          uv run alembic upgrade head
          uv run soteops-seed

      - name: Start mock integration
        working-directory: .
        run: |
          uv run uvicorn mock_integration.main:create_app --factory --app-dir mock-integration --host 127.0.0.1 --port 8001 &
          for _ in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8001/health >/dev/null && exit 0
            sleep 0.25
          done
          exit 1

      - name: Start API
        working-directory: .
        run: |
          uv run uvicorn app.main:create_app --factory --app-dir backend --host 127.0.0.1 --port 8000 &
          for _ in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8000/health >/dev/null && exit 0
            sleep 0.25
          done
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        run: npm run build

      - name: Start frontend
        run: |
          npm run start &
          for _ in $(seq 1 40); do
            curl -fsS http://127.0.0.1:3000 >/dev/null && exit 0
            sleep 0.25
          done
          exit 1

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
