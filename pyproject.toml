[project]
name = "soteops-agent"
version = "0.1.0"
description = "Finnish-language synthetic access-request preparation prototype."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
  "soteops-backend",
  "soteops-mock-integration",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1,<0.29",
  "mypy>=1.17.1,<2",
  "pip-audit>=2.9.0,<3",
  "pytest>=8.4.1,<9",
  "pytest-cov>=6.2.1,<7",
  "ruff>=0.12.10,<0.14",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["backend", "mock-integration"]

[tool.uv.sources]
soteops-backend = { workspace = true }
soteops-mock-integration = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend", "mock-integration"]
extend-exclude = ["backend/alembic/script.py.mako"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"backend/alembic/versions/*.py" = ["E501"]
"backend/app/workflow/prompts.py" = ["E501"]
"backend/tests/conftest.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["app", "mock_integration"]
mypy_path = "backend:mock-integration"
explicit_package_bases = true
warn_unused_ignores = true

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["backend/tests", "mock-integration/tests"]
pythonpath = ["backend", "mock-integration"]
filterwarnings = [
  "error",
  "ignore::DeprecationWarning",
  "ignore::PendingDeprecationWarning",
  "ignore::starlette.exceptions.StarletteDeprecationWarning",
  "ignore::langchain_core._api.deprecation.LangChainPendingDeprecationWarning",
  "ignore:The default value of `allowed_objects` will change in a future version:Warning",
]

[tool.coverage.run]
branch = true
source = ["backend/app", "mock-integration/mock_integration"]

[tool.coverage.report]
show_missing = true
skip_empty = true
